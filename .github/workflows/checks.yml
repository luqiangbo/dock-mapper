name: Checks

on:
  push:
    branches: [test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: windows-latest
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Check workflow and release script syntax
        run: node .github/scripts/workflow-preflight.mjs
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x86_64
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Frontend types and behavior
        shell: pwsh
        run: |
          node .github/scripts/tauri-versions.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test .github/scripts/release-version.test.mjs .github/scripts/release-api.test.mjs .github/scripts/release-assets.test.mjs .github/scripts/winget-fork.test.mjs .github/scripts/workflow-preflight.test.mjs
      - name: Rust core behavior
        working-directory: src-tauri
        run: cargo test -- --skip model

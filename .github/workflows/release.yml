name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x86_64

      # ============================================================
      # 自动同步版本号：从 tag v1.0.5 提取 1.0.5 写入 tauri.conf.json
      # 之后你只管打 tag，不用手动改版本号
      # ============================================================
      - name: Sync version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Host "Setting version to $version from tag $tag"
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.version = $version
          $config | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      # ============================================================
      # 代码签名（可选）
      # ============================================================
      - name: Import Windows code signing certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "WINDOWS_CERTIFICATE not configured, skipping"
            exit 0
          }
          New-Item -ItemType directory -Path certificate -Force
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt
          Import-PfxCertificate -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)

      # ============================================================
      # 构建 + 发布 + Winget 提交，一步到位
      # ============================================================
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        id: tauri_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DockMapper ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
          releaseBody: |
            ## 一键安装

            ```powershell
            winget install luqiangbo.DockMapper
            ```

            或下载 `DockMapper_${{ github.ref_name }}_x64-setup.exe` 双击安装。

            ## 更新内容

            [commits](https://github.com/luqiangbo/dock-mapper/commits/${{ github.ref_name }})
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

      # ============================================================
      # 更新 updater.json（备用）
      # ============================================================
      - name: Update updater.json on main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Generate updater.json
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          $version = $tag.TrimStart('v')
          $url = "https://github.com/luqiangbo/dock-mapper/releases/download/$tag/DockMapper_${version}_x64-setup.exe"
          $json = @{
            version = $version
            notes  = "Release $tag"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = ""
                url = $url
              }
            }
          } | ConvertTo-Json
          Set-Content -Path "main-branch/updater.json" -Value $json

      - name: Commit updater.json
        continue-on-error: true
        shell: pwsh
        working-directory: main-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater.json
          git diff --cached --quiet || git commit -m "chore: update updater.json for ${{ github.ref_name }} [skip ci]"
          git push

      # ============================================================
      # 提交到 Winget
      # ============================================================
      - name: Submit Winget manifest
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "WINGET_TOKEN not configured, skipping Winget submission"
            exit 0
          }
          $tag = $env:TAG_NAME
          $version = $tag.TrimStart('v')

          # 下载安装器并计算 SHA256
          $release = gh release view $tag --json assets --jq '.assets[] | select(.name | endswith("_x64-setup.exe")) | {name: .name, url: .url}'
          $assetName = ($release | ConvertFrom-Json).name
          $downloadUrl = ($release | ConvertFrom-Json).url
          Invoke-WebRequest -Uri $downloadUrl -OutFile "$env:TEMP\$assetName"
          $hash = (Get-FileHash "$env:TEMP\$assetName" -Algorithm SHA256).Hash.ToLower()

          # 生成 manifest YAML
          $manifestDir = "$env:TEMP\winget-manifest"
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          $f = "$manifestDir\$version.yaml"
          Set-Content -Path $f -Value "PackageIdentifier: luqiangbo.DockMapper"
          Add-Content -Path $f -Value "PackageVersion: $version"
          Add-Content -Path $f -Value "PackageLocale: zh-CN"
          Add-Content -Path $f -Value "Publisher: luqiangbo"
          Add-Content -Path $f -Value "PackageName: DockMapper"
          Add-Content -Path $f -Value "License: MIT License"
          Add-Content -Path $f -Value "ShortDescription: Windows taskbar widget and key mapping tool"
          Add-Content -Path $f -Value "ManifestType: singleton"
          Add-Content -Path $f -Value "ManifestVersion: 1.6.0"
          Add-Content -Path $f -Value "Installers:"
          Add-Content -Path $f -Value "  - Architecture: x64"
          Add-Content -Path $f -Value "    InstallerType: nullsoft"
          Add-Content -Path $f -Value "    InstallerUrl: $downloadUrl"
          Add-Content -Path $f -Value ("    InstallerSha256: " + $hash.ToUpper())
          Add-Content -Path $f -Value "    InstallerSwitches:"
          Add-Content -Path $f -Value "      Silent: /S"
          Add-Content -Path $f -Value "      SilentWithProgress: /S"

          # 下载最新的 wingetcreate（最稳健的方式，不依赖 winget 命令）
          $wcZip = "$env:TEMP\wingetcreate.zip"
          $wcDir = "$env:TEMP\wingetcreate"
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/latest/download/wingetcreate.zip" -OutFile $wcZip
          Expand-Archive -Path $wcZip -DestinationPath $wcDir -Force
          $wcexe = "$wcDir\wingetcreate.exe"

          # 提交到 winget-pkgs
          & $wcexe submit --token $env:WINGET_TOKEN "$manifestDir\$version.yaml"

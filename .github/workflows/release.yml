name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Required checks
    uses: ./.github/workflows/checks.yml

  publish-release:
    name: Build, verify and publish immutable release
    needs: validate
    runs-on: windows-latest
    concurrency:
      group: dockmapper-release
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      tag: ${{ steps.prepare.outputs.tag }}
      published: ${{ steps.publish.outputs.published || steps.prepare.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Allocate or resume release
        id: prepare
        run: node .github/scripts/release.mjs prepare
      - name: Synchronize build version
        if: steps.prepare.outputs.build == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: node .github/scripts/sync-version.mjs "$env:VERSION"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.prepare.outputs.build == 'true'
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        if: steps.prepare.outputs.build == 'true'
        with:
          workspaces: src-tauri
          key: windows-x86_64
      - run: pnpm install --frozen-lockfile
        if: steps.prepare.outputs.build == 'true'
      - name: Import Windows signing certificate
        if: steps.prepare.outputs.build == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_SIGNING_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGNING_TIMESTAMP_URL }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signingConfig = @{bundle=@{windows=@{}}}
          $signingConfig | ConvertTo-Json -Depth 4 | Set-Content tauri-signing.json -Encoding utf8NoBOM
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "Windows certificate is not configured; Authenticode verification will be informational."
            exit 0
          }
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/certificate.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/certificate.txt certificate/certificate.pfx
          if ($LASTEXITCODE -ne 0) { throw "Certificate decode failed" }
          Remove-Item -Path certificate/certificate.txt
          $certificates = @(Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force))
          $signers = @($certificates | Where-Object {
            $_.HasPrivateKey -and (@($_.EnhancedKeyUsageList.ObjectId) -contains '1.3.6.1.5.5.7.3.3')
          })
          if ($signers.Count -ne 1) { throw "Expected exactly one code signing certificate with a private key" }
          $certificate = $signers[0]
          if ($certificate.NotBefore -gt (Get-Date) -or $certificate.NotAfter -le (Get-Date)) {
            throw "Windows code signing certificate is not currently valid"
          }
          if (-not $env:WINDOWS_SIGNING_TIMESTAMP_URL) { throw "WINDOWS_SIGNING_TIMESTAMP_URL repository variable is required when signing Windows binaries" }
          $timestampUri = [Uri]$env:WINDOWS_SIGNING_TIMESTAMP_URL
          if (-not $timestampUri.IsAbsoluteUri -or $timestampUri.Scheme -notin @('http', 'https')) { throw "Invalid timestamp URL" }
          $signingConfig.bundle.windows = @{
            certificateThumbprint=$certificate.Thumbprint
            digestAlgorithm='sha256'
            timestampUrl=$env:WINDOWS_SIGNING_TIMESTAMP_URL
          }
          $signingConfig | ConvertTo-Json -Depth 4 | Set-Content tauri-signing.json -Encoding utf8NoBOM


      - name: Check latest main before build
        id: latest
        if: steps.prepare.outputs.build == 'true'
        run: node .github/scripts/release.mjs check
      - name: Check updater signing configuration
        if: steps.latest.outputs.build == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node .github/scripts/signing-preflight.mjs
      - name: Build and upload draft release
        if: steps.latest.outputs.build == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DOCKMAPPER_RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
          DOCKMAPPER_COMMIT: ${{ github.sha }}
        with:
          releaseId: ${{ steps.prepare.outputs.release_id }}
          tagName: ${{ steps.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis --config tauri-signing.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true

      - name: Verify assets and attach build provenance
        if: steps.latest.outputs.build == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAG_NAME: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_ID: ${{ steps.prepare.outputs.release_id }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          gh release download $env:TAG_NAME --dir release-assets --clobber
          if ($LASTEXITCODE -ne 0) { throw "Asset download failed" }
          $installerName = "DockMapper_$($env:VERSION)_x64-setup.exe"
          $installer = Get-Item (Join-Path release-assets $installerName)
          if ($installer.Length -eq 0) { throw "Installer is empty" }
          # tauri-action v1 emits API asset URLs; bind the conversion to this release's installer ID.
          # The tag endpoint only returns published releases; this candidate is still a draft.
          if ($env:RELEASE_ID -notmatch '^[1-9][0-9]*$') { throw "Release ID is missing or invalid" }
          $releaseJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID"
          if ($LASTEXITCODE -ne 0) { throw "Release asset metadata lookup failed" }
          $releaseMetadata = $releaseJson | ConvertFrom-Json
          if ($releaseMetadata.id -ne $env:RELEASE_ID -or $releaseMetadata.tag_name -ne $env:TAG_NAME) { throw "Release metadata does not match allocated candidate" }
          $installerAssets = @($releaseMetadata.assets | Where-Object { $_.name -eq $installerName })
          if ($installerAssets.Count -ne 1) { throw "Expected exactly one installer asset" }
          # Draft browser URLs can use an untagged placeholder. Bind identity to the API asset URL instead.
          $installerAsset = $installerAssets[0]
          if ($installerAsset.id -notmatch '^[1-9][0-9]*$') { throw "Installer asset ID is missing or invalid" }
          $expectedApiUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($installerAsset.id)"
          if ($installerAsset.url -ne $expectedApiUrl) { throw "Installer asset API URL mismatch: expected $expectedApiUrl, received $($installerAsset.url)" }
          if ($installerAsset.state -ne 'uploaded' -or $installerAsset.size -ne $installer.Length) { throw "Installer asset is not uploaded or size mismatch" }
          node .github/scripts/normalize-updater.mjs release-assets "$env:GITHUB_REPOSITORY" "$env:VERSION" "$($installerAssets[0].id)"
          if ($LASTEXITCODE -ne 0) { throw "Updater URL normalization failed" }
          $binary = Get-Item src-tauri/target/release/dock-mapper.exe
          $resource = $binary.VersionInfo
          $binaryVersion = "$($resource.FileMajorPart).$($resource.FileMinorPart).$($resource.FileBuildPart)"
          if ($binaryVersion -ne $env:VERSION) { throw "Built executable version mismatch: $binaryVersion" }
          $updater = Get-Content release-assets/latest.json -Raw | ConvertFrom-Json
          if ($updater.version.TrimStart('v') -ne $env:VERSION) { throw "Updater version mismatch" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($env:WINDOWS_CERTIFICATE -and $signature.Status -ne 'Valid') { throw "Invalid Authenticode signature" }
          if ($env:WINDOWS_CERTIFICATE) {
            $expectedThumbprint = (Get-Content tauri-signing.json -Raw | ConvertFrom-Json).bundle.windows.certificateThumbprint
            if ($signature.SignerCertificate.Thumbprint -ne $expectedThumbprint) { throw "Installer signing certificate mismatch" }
            $binarySignature = Get-AuthenticodeSignature $binary.FullName
            if ($binarySignature.Status -ne 'Valid' -or $binarySignature.SignerCertificate.Thumbprint -ne $expectedThumbprint) { throw "Invalid executable Authenticode signature" }
          }
          $checksums = @{}
          foreach ($name in @($installerName, 'latest.json')) {
            $checksums[$name] = (Get-FileHash (Join-Path release-assets $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{version=$env:VERSION; sha=$env:GITHUB_SHA; sha256=$checksums} | ConvertTo-Json -Depth 3 | Set-Content release-assets/build-info.json -Encoding utf8NoBOM
          pnpm release:verify release-assets "$env:GITHUB_REPOSITORY" "$env:VERSION" "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw "Release asset verification failed" }
          gh release upload $env:TAG_NAME release-assets/latest.json release-assets/build-info.json --clobber
          if ($LASTEXITCODE -ne 0) { throw "Provenance upload failed" }
      - name: Publish latest verified candidate
        id: publish
        if: steps.latest.outputs.build == 'true'
        run: node .github/scripts/release.mjs publish

  submit-winget:
    name: Submit Winget update
    needs: publish-release
    if: needs.publish-release.outputs.published == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Submit manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.publish-release.outputs.tag }}
          VERSION: ${{ needs.publish-release.outputs.version }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Host "WINGET_TOKEN is not configured; skipping Winget submission."
            exit 0
          }

          $installerUrl = gh release view $env:TAG_NAME `
            --repo "${{ github.repository }}" `
            --json assets `
            --jq '.assets[] | select(.name | endswith("_x64-setup.exe")) | .url'
          if (-not $installerUrl) { throw "Release installer URL is missing" }

          $wingetCreate = "$env:TEMP\wingetcreate.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe" `
            -OutFile $wingetCreate

          $manifestRoot = Join-Path $PWD "manifests"
          & $wingetCreate update luqiangbo.DockMapper `
            --out $manifestRoot `
            --urls $installerUrl `
            --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "Winget manifest generation failed: $LASTEXITCODE" }

          $installerManifests = @(Get-ChildItem $manifestRoot -Recurse -Filter "*.installer.yaml")
          if ($installerManifests.Count -ne 1) {
            throw "Expected one installer manifest, found $($installerManifests.Count)"
          }

          $installerManifest = $installerManifests[0]
          $manifest = Get-Content $installerManifest.FullName -Raw
          $vcredistPackage = "Microsoft.VCRedist.2015+.x64"
          if ($manifest -notmatch [regex]::Escape("PackageIdentifier: $vcredistPackage")) {
            if ($manifest -match '(?m)^Dependencies:\s*$') {
              $packageDependency = "  PackageDependencies:`n  - PackageIdentifier: $vcredistPackage`n"
              $manifest = $manifest -replace '(?m)^Dependencies:\s*$', "Dependencies:`n$packageDependency"
            } else {
              $dependency = "Dependencies:`n  PackageDependencies:`n  - PackageIdentifier: $vcredistPackage`n"
              $manifest = $manifest -replace '(?m)^Installers:', "${dependency}Installers:"
            }
            Set-Content $installerManifest.FullName -Value $manifest -NoNewline -Encoding utf8
          }

          $manifest = Get-Content $installerManifest.FullName -Raw
          if ($manifest -notmatch [regex]::Escape("PackageIdentifier: $vcredistPackage")) {
            throw "VC++ runtime dependency was not added to the Winget manifest"
          }

          $manifestDirectory = $installerManifest.Directory.FullName
          & $wingetCreate submit `
            --no-open `
            --prtitle "New version: luqiangbo.DockMapper version $env:VERSION" `
            $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw "Winget manifest submission failed: $LASTEXITCODE" }

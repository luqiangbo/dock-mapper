name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x86_64

      - name: Validate tag and source versions
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: ${{ github.ref_name }}"
          }
          node .github/scripts/sync-version.mjs --check $version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend quality checks
        shell: pwsh
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Rust quality checks
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  publish-release:
    name: Build, verify and publish immutable release
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-x86_64

      - run: pnpm install --frozen-lockfile

      - name: Import Windows signing certificate
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "Windows certificate is not configured; Authenticode verification will be informational."
            exit 0
          }
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/certificate.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/certificate.txt certificate/certificate.pfx
          Remove-Item -Path certificate/certificate.txt
          Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

      - name: Build and upload draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DockMapper ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseBody: |
            ## 安装

            ```powershell
            winget install luqiangbo.DockMapper
            ```

            也可下载 `DockMapper_${{ needs.validate.outputs.version }}_x64-setup.exe`。

            [查看本版本提交](https://github.com/luqiangbo/dock-mapper/commits/${{ github.ref_name }})

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          TAG_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          gh release download $env:TAG_NAME --dir release-assets

          $installer = Get-ChildItem release-assets -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer is missing" }

          $updater = Get-Content release-assets/latest.json -Raw | ConvertFrom-Json
          $platforms = $updater.platforms.PSObject.Properties
          if (-not $platforms -or $platforms.Count -eq 0) { throw "latest.json has no platforms" }
          foreach ($platform in $platforms) {
            if (-not $platform.Value.signature) {
              throw "Updater signature is missing for $($platform.Name)"
            }
          }

          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($env:WINDOWS_CERTIFICATE -and $signature.Status -ne "Valid") {
            throw "Authenticode signature is invalid: $($signature.Status)"
          }
          Write-Host "Installer SHA-256: $((Get-FileHash $installer.FullName -Algorithm SHA256).Hash)"

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

  submit-winget:
    name: Submit Winget update
    needs: [validate, publish-release]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Submit manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:WINGET_CREATE_GITHUB_TOKEN) {
            Write-Host "WINGET_TOKEN is not configured; skipping Winget submission."
            exit 0
          }

          $installerUrl = gh release view $env:TAG_NAME `
            --repo "${{ github.repository }}" `
            --json assets `
            --jq '.assets[] | select(.name | endswith("_x64-setup.exe")) | .url'
          if (-not $installerUrl) { throw "Release installer URL is missing" }

          $wingetCreate = "$env:TEMP\wingetcreate.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe" `
            -OutFile $wingetCreate

          & $wingetCreate update luqiangbo.DockMapper `
            --submit `
            --urls $installerUrl `
            --version $env:VERSION

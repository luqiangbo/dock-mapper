[package]
name = "dock-mapper"
version = "1.1.5"
description = "DockMapper — Windows taskbar widget & key mapping tool"
authors = ["qqpp"]
edition = "2021"

[lib]
name = "dock_mapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }
serde_json = "1.0.154"

[dependencies]
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "rustls-no-provider", "system-proxy"] }
md5 = "0.8.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_Registry",
    "Win32_System_Power",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging"
] }
sysinfo = "0.40.4"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
arboard = "3.7.0"
base64 = "0.23.1"
directories = "6.0.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
quircs = "0.10.3"
rfd = "0.18.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
paddleocr_rs_onnx = "=0.2.8"
